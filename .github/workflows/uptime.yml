name: Uptime

# Checks https://www.maw3ed.net/api/health every 5 minutes
# (docs/release/FINAL_DEPLOYMENT_CHECKLIST.md item 10).
#
# The anonymous health check answers 200 {"status":"ok"} when the app and
# its database answer, 503 when the database does not.
#
# Down = two failed checks in a row, 60 s apart (one blip is not an alert).
# Then the run fails and one issue labelled "uptime" is opened and assigned
# to the repository owner (an assignment always notifies, watching or not).
# Later failures add nothing while that
# issue is open. The first healthy check after it comments the outage
# length and closes the issue.
#
# GitHub runs scheduled workflows late under load (often 5-15 minutes), so
# this catches outages, not short blips. Scheduled workflows are paused
# after 60 days without repository activity; GitHub emails before that.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check (leave empty for production). A wrong address tests the alert."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

env:
  URL: ${{ inputs.url || 'https://www.maw3ed.net/api/health' }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check twice, 60 s apart
        id: probe
        run: |
          probe() {
            curl -s -o body.txt -w '%{http_code} %{time_total}' --max-time 20 \
              -H 'Cache-Control: no-cache' -A 'maw3ed-uptime (GitHub Actions)' "$URL" || true   # prints "000 …" itself on failure
          }
          healthy() { [ "$1" = 200 ] && grep -q '"status":"ok"' body.txt; }
          read -r code secs <<< "$(probe)"
          echo "first: HTTP $code in ${secs}s, body: $(head -c 200 body.txt 2>/dev/null)"
          if ! healthy "$code"; then
            sleep 60
            read -r code secs <<< "$(probe)"
            echo "second: HTTP $code in ${secs}s, body: $(head -c 200 body.txt 2>/dev/null)"
          fi
          if healthy "$code"; then echo "up=true" >> "$GITHUB_OUTPUT"; else echo "up=false" >> "$GITHUB_OUTPUT"; fi
          echo "detail=HTTP $code in ${secs}s" >> "$GITHUB_OUTPUT"

      - name: Open an issue when down
        if: steps.probe.outputs.up == 'false'
        run: |
          open=$(gh issue list --label uptime --state open --json number -q '.[0].number // empty')
          if [ -z "$open" ]; then
            gh label create uptime --color B60205 --description "Opened by the Uptime workflow" --force >/dev/null
            gh issue create --label uptime --assignee "${{ github.repository_owner }}" \
              --title "Production is down: /api/health failing" \
              --body "$(printf '%s\n' \
                "The uptime check failed twice in a row, 60 s apart." \
                "" \
                "- URL: $URL" \
                "- Last result: ${{ steps.probe.outputs.detail }}" \
                "- First seen: $(date -u '+%Y-%m-%d %H:%M UTC')" \
                "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                "" \
                "503 means the database is not answering (Neon). 000 or 5xx otherwise: Vercel or the app." \
                "See docs/release/FINAL_OPERATIONAL_RUNBOOK.md. This issue closes itself when the check passes again.")"
          fi
          echo "::error::$URL is down (${{ steps.probe.outputs.detail }})"
          exit 1

      - name: Close the issue when back up
        if: steps.probe.outputs.up == 'true'
        run: |
          open=$(gh issue list --label uptime --state open --json number,createdAt -q '.[0] // empty | "\(.number) \(.createdAt)"')
          if [ -n "$open" ]; then
            read -r num since <<< "$open"
            mins=$(( ( $(date -u +%s) - $(date -u -d "$since" +%s) ) / 60 ))
            gh issue close "$num" --comment "Back up: ${{ steps.probe.outputs.detail }} at $(date -u '+%Y-%m-%d %H:%M UTC'), about $mins minutes after this issue was opened."
          fi
