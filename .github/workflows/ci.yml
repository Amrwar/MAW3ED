name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which reads the schema only and
      # needs no database connection.
      - name: Install dependencies
        run: npm ci

      # A shim was once placed at node_modules/vitest/vitest.mjs that printed
      # a passing summary without running anything, so CI stayed green while
      # the suite never executed. This proves the runner is real before any
      # result from it is trusted: a file that throws on import must fail.
      - name: Verify the test runner actually runs tests
        run: |
          mkdir -p src/__ci
          echo 'throw new Error("ci canary: this module was executed");' > src/__ci/canary.test.ts
          if npx vitest run src/__ci/canary.test.ts > /dev/null 2>&1; then
            echo "::error::Test runner reported success for a module that throws on import."
            rm -rf src/__ci
            exit 1
          fi
          rm -rf src/__ci
          echo "Runner verified."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Security gates (Phase 20). A critical advisory in a production
      # dependency fails the build. High advisories are reported but do
      # not block: an advisory published upstream on a Tuesday must not
      # stop a hotfix, and the report is what somebody acts on. The
      # mobile audit reads the lockfile alone (no install of the Expo
      # toolchain); its remaining high advisories are tracked in
      # docs/security/SECURITY_REPORT.md (S-07).
      - name: Dependency audit (web, production, critical blocks)
        run: npm audit --omit=dev --audit-level=critical

      - name: Dependency audit (web, production, high reported)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (mobile, production, critical blocks)
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=critical --package-lock-only

      - name: Test
        run: npm run test:run

      # A green run with zero tests collected is the other way this can go
      # quiet. Require a floor well under the real count but above zero.
      #
      # The report goes to a named file: since Vitest 5 the JSON reporter
      # writes to .vitest/json/output.json instead of stdout, and reading
      # stdout counted 0 on every run.
      - name: Assert the suite is not empty
        run: |
          npx vitest run --reporter=json --outputFile=vitest-report.json > /dev/null 2>&1 || true
          COUNT=$(node -e "
            try{console.log(require('./vitest-report.json').numTotalTests??0)}catch{console.log(0)}
          ")
          echo "tests collected: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::Expected at least 100 tests, collected $COUNT."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-placeholder-secret-at-least-16-chars

      # Last, and not gating.
      #
      # This used to sit between Lint and Test, and it has been failing
      # on 314 files for months — which meant Test, Build and the
      # empty-suite guard below it never ran at all. A style check was
      # quietly disabling every check that could catch a real bug.
      #
      # It still runs and still reports, so the debt stays visible. It
      # no longer decides whether the suite gets to run. Clearing it is
      # `npm run format`, which touches most of the repo and belongs in
      # a commit of its own.
      - name: Format check (non-blocking)
        continue-on-error: true
        run: npm run format:check
